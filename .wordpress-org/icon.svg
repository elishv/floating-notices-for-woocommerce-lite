<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Floating Notices for WooCommerce icon - A-in plugin family</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171C30"/>
      <stop offset="1" stop-color="#0E1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background">
    <rect width="256" height="256" rx="56" fill="url(#tile)"/>
    <rect width="256" height="256" rx="56" fill="url(#glow)"/>
    <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#F472B6" stroke-opacity="0.28" stroke-width="3"/>
  </g>
  <g id="pictogram">
      <ellipse id="shadow" cx="128" cy="204" rx="66" ry="10" fill="#F472B6" fill-opacity="0.22"/>
      <rect id="toast-ghost" x="62" y="128" width="132" height="52" rx="18" fill="#F472B6" fill-opacity="0.28"/>
      <g id="toast">
        <rect x="40" y="60" width="176" height="80" rx="24" fill="#F472B6"/>
        <circle cx="82" cy="100" r="22" fill="#0E1220"/>
        <path d="M72 100 l7 7 l14 -15" fill="none" stroke="#F472B6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="116" y="86" width="76" height="11" rx="5.5" fill="#0E1220" fill-opacity="0.8"/>
        <rect x="116" y="105" width="52" height="11" rx="5.5" fill="#0E1220" fill-opacity="0.45"/>
      </g>
  </g>
</svg>
